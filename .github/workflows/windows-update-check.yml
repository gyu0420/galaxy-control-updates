name: Windows update verification
on:
  push:
    paths:
      - '.github/workflows/windows-update-check.yml'
      - 'tests/**'
      - 'installers/**'
      - 'tools/**'
      - 'latest.json'
      - 'updates/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "PySide6>=6.7,<7" "cryptography>=43,<50" "websocket-client>=1.8,<2"
      - run: python tests/windows_update_check.py
        env:
          QT_QPA_PLATFORM: offscreen
          GALAXY_CANDIDATE: ${{ github.ref_name != 'main' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-verification
          path: verification-output/
